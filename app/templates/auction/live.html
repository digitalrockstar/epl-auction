<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auction · EPL Season 3</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/tv.css">
</head>
<body class="tv-body">
    <div id="tv-ticker-slot" hx-get="{{ ticker_fragment_url }}" hx-trigger="every 90s" hx-swap="innerHTML">
        {% include "auction/_ticker_fragment.html" %}
    </div>
    <div class="tv-topbar">
        <div class="tv-brand">
            <img src="/static/img/placeholder_epl_crest.svg" alt="EPL crest">
            EMMANUEL PREMIER LEAGUE
        </div>
        <div class="tv-title">LIVE <span class="accent">AUCTION</span></div>
        <div class="tv-meta">
            <span><b>{{ teams|length }}</b> Teams</span>
            <div id="tv-timer-slot" hx-get="{{ timer_fragment_url }}" hx-trigger="every 1s" hx-swap="innerHTML">
                {% include "auction/_timer_fragment.html" %}
            </div>
            <span class="badge badge-live">Live</span>
        </div>
    </div>
    <div id="tv-countdown-slot" hx-get="{{ countdown_fragment_url }}" hx-trigger="every 20s" hx-swap="innerHTML">
        {% include "auction/_countdown_fragment.html" %}
    </div>
    <div id="tv-wrap" hx-get="{{ fragment_url }}" hx-trigger="every 2s" hx-swap="innerHTML">
        {% include "auction/_live_fragment.html" %}
    </div>

    <audio id="snd-bid" src="/static/sfx/bid.mp3" preload="auto"></audio>
    <audio id="snd-sold" src="/static/sfx/sold.mp3" preload="auto"></audio>
    <audio id="snd-unsold" src="/static/sfx/unsold.mp3" preload="auto"></audio>

    <script>
    let flipInterval = null;
    function initFlipCountdown() {
        clearInterval(flipInterval);
        const el = document.querySelector('.flip-countdown');
        if (!el) return;
        const target = new Date(el.dataset.target).getTime();
        const tick = () => {
            const diff = target - Date.now();
            if (diff <= 0) {
                clearInterval(flipInterval);
                const slot = document.getElementById('tv-countdown-slot');
                if (slot) slot.innerHTML = '<div class="tv-empty" data-status="none">NEXT PLAYER COMING SOON</div>';
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor(diff % 86400000 / 3600000);
            const m = Math.floor(diff % 3600000 / 60000);
            const s = Math.floor(diff % 60000 / 1000);
            const vals = { d, h, m, s };
            el.querySelectorAll('.flip-value').forEach(span => {
                const next = String(vals[span.dataset.unit]).padStart(2, '0');
                if (span.textContent !== next) {
                    span.textContent = next;
                    span.classList.remove('flip');
                    void span.offsetWidth;
                    span.classList.add('flip');
                }
            });
        };
        tick();
        flipInterval = setInterval(tick, 1000);
    }
    initFlipCountdown();

    let lastBid = null, lastTeam = null, lastStatus = null, lastResolvedId = null;
    document.body.addEventListener('htmx:afterSwap', (e) => {
        if (e.target.id === 'tv-countdown-slot') initFlipCountdown();
        const el = document.getElementById('tv-wrap');
        const bid = el.dataset.bid, team = el.dataset.team, status = el.dataset.status;
        if (bid !== undefined && lastBid !== null && (bid !== lastBid || team !== lastTeam)) {
            document.getElementById('snd-bid').play().catch(()=>{});
        }
        if (status === 'sold' && lastStatus !== 'sold') {
            document.getElementById('snd-sold').play().catch(()=>{});
        }
        if (status === 'unsold' && lastStatus !== 'unsold') {
            document.getElementById('snd-unsold').play().catch(()=>{});
        }

        // SOLD / WILL BE BACK stamp should bounce in once, then hold still,
        // not replay its entrance animation on every 3s poll while it's
        // still on screen.
        const stamp = document.querySelector('.tv-result-stamp');
        if (stamp) {
            const rid = stamp.dataset.resolvedId;
            if (rid === lastResolvedId) {
                stamp.classList.add('no-replay');
            } else {
                lastResolvedId = rid;
            }
        } else {
            lastResolvedId = null;
        }
        lastBid = bid; lastTeam = team; lastStatus = status;
    });
    </script>
</body>
</html>
