<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auction · EPL Season 3</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/tv.css">
</head>
<body class="tv-body" hx-get="{{ fragment_url }}" hx-trigger="every 1s" hx-target="#tv-wrap" hx-swap="innerHTML">
    <div class="tv-topbar">
        <div class="tv-brand">
            <img src="/static/img/placeholder_epl_crest.svg" alt="EPL crest">
            EMMANUEL PREMIER LEAGUE
        </div>
        <div class="tv-title">LIVE <span class="accent">AUCTION</span></div>
        <div class="tv-meta">
            <span><b>{{ teams|length }}</b> Teams</span>
            <span class="badge badge-live">Live</span>
        </div>
    </div>
    <div id="tv-wrap">
        {% include "auction/_live_fragment.html" %}
    </div>

    <audio id="snd-bid" src="/static/sfx/bid.mp3" preload="auto"></audio>
    <audio id="snd-sold" src="/static/sfx/sold.mp3" preload="auto"></audio>
    <audio id="snd-unsold" src="/static/sfx/unsold.mp3" preload="auto"></audio>

    <script>
    let lastBid = null, lastTeam = null, lastStatus = null;
    document.body.addEventListener('htmx:afterSwap', () => {
        const el = document.getElementById('tv-wrap');
        const bid = el.dataset.bid, team = el.dataset.team, status = el.dataset.status;
        if (bid !== undefined && lastBid !== null && (bid !== lastBid || team !== lastTeam)) {
            document.getElementById('snd-bid').play().catch(()=>{});
        }
        if (status === 'sold' && lastStatus !== 'sold') {
            document.getElementById('snd-sold').play().catch(()=>{});
        }
        if (status === 'unsold' && lastStatus !== 'unsold') {
            document.getElementById('snd-unsold').play().catch(()=>{});
        }
        lastBid = bid; lastTeam = team; lastStatus = status;
    });
    </script>
</body>
</html>
