{% if screen_state == "live" %}
<div data-state="live"></div>
{% elif screen_state == "countdown" %}
<div data-state="countdown" id="flip-countdown-wrap" hx-preserve="true" class="tv-empty flip-countdown-wrap">
    <p class="tv-tag" style="margin-bottom:14px;">AUCTION STARTS IN</p>
    <div class="flip-countdown" id="flip-countdown" data-target="{{ countdown_target.strftime('%Y-%m-%dT%H:%M:%S') }}+05:30">
        <div class="flip-unit"><span class="flip-value" data-unit="d">00</span><label>Days</label></div>
        <div class="flip-unit"><span class="flip-value" data-unit="h">00</span><label>Hours</label></div>
        <div class="flip-unit"><span class="flip-value" data-unit="m">00</span><label>Mins</label></div>
        <div class="flip-unit"><span class="flip-value" data-unit="s">00</span><label>Secs</label></div>
    </div>
</div>
{% elif screen_state == "starting_now" %}
<div data-state="starting_now" class="tv-starting-now">AUCTION STARTING NOW</div>
{% elif screen_state == "see_you_next_year" %}
<div data-state="see_you_next_year" class="tv-starting-now">SEE YOU NEXT YEAR</div>
{% endif %}
