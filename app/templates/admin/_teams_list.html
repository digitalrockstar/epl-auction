{% if error %}<span class="error">{{ error }}</span>{% endif %}
{% if teams %}
<div class="team-grid">
    {% for team in teams %}
        {% include "admin/_team_row.html" %}
    {% endfor %}
</div>
{% else %}
<div class="empty-state panel">
    <p>No teams yet. Add your first team above.</p>
</div>
{% endif %}
