<tr id="team-row-{{ team.id }}">
    <td>{{ team.name }}</td>
    <td>{{ team.purse_total }}</td>
    <td>
        {% if team.manager %}
            {{ team.manager.name }} ({{ team.manager.phone }})
        {% else %}
            <button
                hx-get="/admin/teams/{{ team.id }}/manager-form"
                hx-target="#team-row-{{ team.id }}"
                hx-swap="outerHTML">
                Assign manager
            </button>
        {% endif %}
    </td>
    <td>{{ "Yes" if team.captain else "Not yet" }}</td>
</tr>
