{% extends "base.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<h1>Teams</h1>

<form hx-post="/admin/teams" hx-target="#teams-wrap" hx-swap="innerHTML" class="add-team-form">
    <input type="text" name="name" placeholder="Team name" required>
    <input type="number" name="purse_total" placeholder="Purse (for player auction)" value="0">
    <button type="submit">Add team</button>
</form>

<div id="teams-wrap">
    {% include "admin/_teams_list.html" %}
</div>
{% endblock %}
