<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EPL Auction{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <span class="brand">Community Cricket Auction</span>
        {% if user %}
        <span class="topbar-right">{{ user.name }} ({{ user.role.value }}) <a href="/logout">Logout</a></span>
        {% endif %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
